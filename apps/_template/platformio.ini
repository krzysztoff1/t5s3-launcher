; Template for a new app that runs under t5s3-launcher.
;
; Copy this directory to apps/<your-app>/, rename things, and build. The two
; files partitions_launcher.csv and src/launcher_api.h are verbatim copies owned
; by the launcher repo (tools/check-sync.sh checks them) - do not edit them here.
;
;   pio run                                           # build
;   ../../tools/flash.py app ota_1 .pio/build/app/firmware.bin --name "My App" --version v0.1 --boot
;   pio run -t upload                                 # or flash straight into ota_1 over USB

[platformio]
default_envs = app
boards_dir = ../../vendor/T5S3-4.7-e-paper-PRO/boards

[env:app]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
board_build.partitions = partitions_launcher.csv
; Which slot `pio run -t upload` writes. ota_0 = 0x310000, ota_1 = 0x910000.
board_upload.offset_address = 0x910000
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../../vendor/T5S3-4.7-e-paper-PRO/lib
lib_ignore = epdiy, lvgl, FastEPD, AnimatedGIF, JPEGDEC, GoodixGT6972P
lib_deps =
    Wire
    SPI
    https://github.com/tonywestonuk/EPD_Painter.git#6335a14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DEPD_PAINTER_PRESET_AUTO
    -Desp_cpu_get_cycle_count=esp_cpu_get_ccount
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DAPP_NAME='"Template App"'
    -DAPP_VERSION='"v0.1.0"'
    -Wl,--gc-sections
