; Paperback — an e-book reader for the LilyGO T5S3 4.7" e-paper PRO, running
; under t5s3-launcher. Sample books and the two font families are embedded in
; the image (board_build.embed_files); more books come from /books/*.txt on the
; SD card. See README.md.
;
;   pio run                                           # build
;   ../../tools/flash.py app ota_1 .pio/build/app/firmware.bin --name Paperback --version v0.1.0 --boot
;
; partitions_launcher.csv and src/launcher_api.h are verbatim copies owned by
; the launcher repo (tools/check-sync.sh checks them) - do not edit them here.

[platformio]
default_envs = app
boards_dir = ../../vendor/T5S3-4.7-e-paper-PRO/boards

[env:app]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
board_build.partitions = partitions_launcher.csv
; Which slot `pio run -t upload` writes. ota_0 = 0x310000, ota_1 = 0x910000.
board_upload.offset_address = 0x910000
; The size check must use our 6 MB OTA slot, not the 3 MB factory partition the
; platform would otherwise pick from the table.
board_build.app_partition_name = ota_1
; Fonts (SIL OFL, see assets/fonts/OFL-*.txt) and the sample library. objcopy
; names each blob after its path: assets/books/alice.txt becomes
; _binary_assets_books_alice_txt_start/_end. tools/prep_books.py regenerates
; src/builtin_books.h; keep this list in step with it.
board_build.embed_files =
    assets/fonts/LiterataR.ttf
    assets/fonts/LiterataI.ttf
    assets/fonts/LiterataB.ttf
    assets/fonts/InterR.ttf
    assets/fonts/InterSB.ttf
    assets/covers/alice.png
    assets/covers/frankenstein.png
    assets/covers/christmas_carol.png
    assets/covers/time_machine.png
    assets/covers/metamorphosis.png
    assets/covers/sherlock_holmes.png
    assets/covers/the_prophet.png
    assets/covers/kamizelka.png
    assets/covers/latarnik.png
    assets/books/alice.txt
    assets/books/frankenstein.txt
    assets/books/christmas_carol.txt
    assets/books/time_machine.txt
    assets/books/metamorphosis.txt
    assets/books/sherlock_holmes.txt
    assets/books/the_prophet.txt
    assets/books/kamizelka.txt
    assets/books/latarnik.txt
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../../vendor/T5S3-4.7-e-paper-PRO/lib
lib_ignore = epdiy, lvgl, FastEPD, AnimatedGIF, GoodixGT6972P, RadioLib, TinyGPSPlus
lib_deps =
    Wire
    SPI
    SD
    https://github.com/tonywestonuk/EPD_Painter.git#6335a14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DEPD_PAINTER_PRESET_AUTO
    -Desp_cpu_get_cycle_count=esp_cpu_get_ccount
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -DAPP_NAME='"Paperback"'
    -DAPP_VERSION='"v0.2.0"'
    -I lib/stb
    ; PNGdec line buffer: RGB PNGs up to 1024 px wide (covers from the SD card).
    -DPNG_MAX_BUFFERED_PIXELS=8194
    -Wl,--gc-sections
