; t5s3-launcher — factory-partition launcher + built-in system check for the
; LilyGO T5S3 4.7" e-paper PRO. See ../docs/boot-flow.md.
;
; The launcher lives in the `factory` app partition (first app slot, 0x10000),
; which is PlatformIO's default upload offset, so a plain `pio run -t upload`
; puts it in the right place. Apps go into ota_0/ota_1 via ../tools/flash.py.

[platformio]
default_envs = launcher
boards_dir = ../vendor/T5S3-4.7-e-paper-PRO/boards

[env:launcher]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
; Shared layout — the single source of truth for every app on the device.
board_build.partitions = ../partitions.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_extra_dirs = ../vendor/T5S3-4.7-e-paper-PRO/lib
; The vendor lib dir carries alternative display stacks; keep them out of the
; build so their board definitions cannot fight EPD_Painter for LCD_CAM.
lib_ignore = epdiy, lvgl, FastEPD, AnimatedGIF, JPEGDEC, GoodixGT6972P
lib_deps =
    Wire
    SPI
    SD
    WiFi
    https://github.com/tonywestonuk/EPD_Painter.git#6335a14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
    h2zero/NimBLE-Arduino@^2.2.3
; EPD_Painter needs C++17 (inline variables, designated initialisers).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    ; USB-Serial-JTAG (board default) rather than OTG: esptool's DTR/RTS reset
    ; works, so flashing the launcher never needs a button press.
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; AUTO compiles the Probe[] table EPD_Painter.cpp references
    ; unconditionally; we still pass the explicit T5 S3 preset to the
    ; constructor so no runtime probing happens. Same recipe as OpenTrailPaper.
    -DEPD_PAINTER_PRESET_AUTO
    ; IDF 5.x name -> IDF 4.4 name, to avoid patching the dependency.
    -Desp_cpu_get_cycle_count=esp_cpu_get_ccount
    -DCORE_DEBUG_LEVEL=1
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -I ../launcher_api
    -Wl,--gc-sections
